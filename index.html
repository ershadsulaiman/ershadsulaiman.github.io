<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ershad Sulaiman | Cybersecurity & Computer Science Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #334155;
            --text-light: #64748b;
            --bg-main: #ffffff;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --transition: all 0.3s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-main);
            line-height: 1.6;
        }
        html {
            scroll-behavior: smooth;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        /* Header */
        header {
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            text-decoration: none;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }
        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: var(--transition);
        }
        nav a:hover {
            color: var(--accent);
        }
        .nav-btn {
            background-color: var(--accent);
            color: white !important;
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        .nav-btn:hover {
            background-color: var(--accent-hover);
        }
        /* Hero Section */
        #home {
            padding: 12rem 0 8rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            text-align: center;
        }
        .badge {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }
        #home h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 800;
        }
        .hero-desc {
            max-width: 700px;
            margin: 0 auto 2rem;
            color: #cbd5e1;
            font-size: 1.05rem;
        }
        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .primary-btn {
            background-color: var(--accent);
            color: white;
        }
        .primary-btn:hover {
            background-color: var(--accent-hover);
        }
        .secondary-btn {
            background: transparent;
            color: white;
            border: 1px solid #475569;
        }
        .secondary-btn:hover {
            border-color: white;
            background: rgba(255, 255, 255, 0.05);
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }
        .social-links a {
            color: #94a3b8;
            font-size: 1.25rem;
            transition: var(--transition);
        }
        .social-links a:hover {
            color: white;
        }
        /* Sections General */
        .section {
            padding: 5rem 0;
        }
        .bg-light {
            background-color: var(--bg-light);
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 3rem;
            text-align: center;
        }
        /* About Section */
        .about-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1.125rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        /* Certifications */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .cert-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: var(--transition);
        }
        .cert-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .cert-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        .cert-card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .cert-date {
            color: var(--text-light);
            font-size: 0.875rem;
        }
        /* Timeline Experience */
        .timeline {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }
        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20px;
            height: 100%;
            width: 2px;
            background: var(--border-color);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 2.5rem;
            padding-left: 50px;
        }
        .timeline-dot {
            position: absolute;
            left: 14px;
            top: 5px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid white;
            box-shadow: 0 0 0 2px var(--accent);
        }
        .timeline-content {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .timeline-content h3 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }
        .timeline-location {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        .timeline-content ul {
            list-style-type: disc;
            padding-left: 1.2rem;
        }
        .timeline-content li {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .skill-category {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .skill-category h3 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .skill-category h3 i {
            color: var(--accent);
        }
        .skill-category p {
            font-size: 0.95rem;
            color: var(--text-main);
        }
        /* Education */
        .edu-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 900px;
            margin: 0 auto;
        }
        .edu-card h3 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }
